# Política de Privacidade

*Última atualização: Novembro de 2026*

Esta Política de Privacidade explica como o **Taquion - Estúdio de escrita** lida com os seus dados pessoais, textos e chaves de acesso.

---

### 1. Armazenamento Local e Coleta de Dados pelo Aplicativo
* **Dados de uso:** O aplicativo não possui servidores próprios e não realiza coleta, rastreamento, armazenamento externo ou venda de dados pessoais, métricas de uso ou conteúdo de suas anotações. Porém é possível enviar dados para serviços de terceiros **opcionalmente**.
* **Armazenamento local:** Todas as suas notas, rascunhos e dados do aplicativo ficam salvos exclusivamente na memória do seu próprio dispositivo.

### 2. Funcionalidade de Inteligência Artificial e Envio de Dados (API do Google)
* **Recurso Opcional:** O aplicativo oferece uma função de avaliação de texto e geração de missões via Inteligência Artificial.
* **Envio Direto ao Provedor:** Quando você aciona a função de IA, o texto aberto, os prompts personalizados, as missões ativas e a versão do texto do envio anterior são enviados diretamente do seu dispositivo para a API do **Google Gemini**.
* **Sem Intermediários:** NENHUM dado passa por servidores do desenvolvedor. A comunicação ocorre diretamente entre o seu dispositivo e os servidores do Google.
* **Política do Provedor:** O processamento, retenção e tratamento dos textos enviados à API estão sujeitos à [Política de Privacidade do Google](https://policies.google.com/privacy) e aos Termos de Serviço da API do Google Gemini.

**Não utilize o botão "Avaliar Capítulo" se o texto aberto tiver dados pessoais ou qualquer informação que você não aceite compartilhar com terceiros.**

### 3. Armazenamento da Chave de API (BYOK)
* Para acionar a Inteligência Artificial, o usuário insere sua própria chave de API (*Bring Your Own Key*).
* A chave de API utilizada por você é armazenada **exclusivamente de forma local** no seu dispositivo e **não** é exportada em backups, utilizada apenas para autenticar as requisições junto à API do Google.
* O aplicativo não transmite sua chave para nenhum outro destino que não seja o endpoint oficial da API do Google.

### 4. Controle e Exclusão de Dados
Como todos os dados ficam salvos em seu dispositivo:
* Você pode apagar suas notas ou remover sua chave de API a qualquer momento diretamente na interface do aplicativo.
* Ao desinstalar o aplicativo ou limpar os dados do app nas configurações do seu sistema operacional, todo o histórico local de notas e configurações armazenadas será permanentemente apagado. É recomendável fazer backup periodicamente.

### 5. Simplificando
* Os dados são armazenados no seu dispositivo. O desenvolvedor não terá acesso a menos que você os compartilhe por e-mail voluntariamente.
* Enviar seus textos para processamento externo é opcional e exige uma chave de API. inclusive, o painel de gameficação & IA pode ser desativado nas configurações.

### 6. Alterações nesta Política
Esta Política de Privacidade pode ser atualizada ocasionalmente para refletir mudanças no aplicativo. Recomendo a consulta periódica desta página.
